services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: church-land-mgt-api:latest
    ports:
      - "6030:6030"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5434/church_land_mgt_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: N0fWbH+9wP1Xn8v7XyZ8E4aNfQqg0Z1LwZBYHk2zT2E=
      JWT_EXPIRATION: 86400000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: church_land_mgt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin@123
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d church_land_mgt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
